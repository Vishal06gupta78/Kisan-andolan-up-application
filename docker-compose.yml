services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_S3_BUCKET=kisan-andolan-media
      - NEXT_PUBLIC_S3_REGION=ap-south-1
    depends_on:
      - backend
    networks:
      - kisan-network
    volumes:
      - frontend-node-modules:/app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/kisanandolan
      - JWT_SECRET=kisan_andolan_secret_key_2024
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dummy}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-dummy}
      - AWS_REGION=ap-south-1
      - S3_BUCKET_NAME=kisan-andolan-media
    depends_on:
      - mongo
    networks:
      - kisan-network
    volumes:
      - backend-node-modules:/app/node_modules

  mongo:
    image: mongo:6-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - kisan-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - kisan-network

networks:
  kisan-network:
    driver: bridge

volumes:
  mongo-data:
  frontend-node-modules:
  backend-node-modules:
